# Determinism contract (AGENTS.md §4.5): platform libm and fused multiply-add may differ across OS/CPU.
# Kernel/solver code must use dc_math::det instead.
disallowed-methods = [
  { path = "f64::sin", reason = "use dc_math::det::sin (deterministic)" },
  { path = "f64::cos", reason = "use dc_math::det::cos (deterministic)" },
  { path = "f64::tan", reason = "use dc_math::det::tan (deterministic)" },
  { path = "f64::asin", reason = "use dc_math::det::asin (deterministic)" },
  { path = "f64::acos", reason = "use dc_math::det::acos (deterministic)" },
  { path = "f64::atan", reason = "use dc_math::det::atan (deterministic)" },
  { path = "f64::atan2", reason = "use dc_math::det::atan2 (deterministic)" },
  { path = "f64::exp", reason = "use dc_math::det::exp (deterministic)" },
  { path = "f64::ln", reason = "use dc_math::det::ln (deterministic)" },
  { path = "f64::log10", reason = "use dc_math::det::log10 (deterministic)" },
  { path = "f64::powf", reason = "use dc_math::det::powf (deterministic)" },
  { path = "f64::powi", reason = "use repeated multiplication or dc_math::det::powf" },
  { path = "f64::hypot", reason = "use dc_math::det::hypot (deterministic)" },
  { path = "f64::cbrt", reason = "use dc_math::det::cbrt (deterministic)" },
  { path = "f64::sinh", reason = "use libm via dc_math::det" },
  { path = "f64::cosh", reason = "use libm via dc_math::det" },
  { path = "f64::tanh", reason = "use libm via dc_math::det" },
  { path = "f64::mul_add", reason = "FMA differs across targets; avoid unless explicitly chosen" },
]
