# Builds the app and the headless tool for Linux (Debian), macOS (Apple silicon) and Windows and attaches them to a GitHub
# release. It runs when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0), and
# nothing else triggers it. Run it by hand ("Run workflow") to test the builds without a release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 (glibc 2.35) so the AppImage also runs on Debian 12 and newer.
          - { os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu, archive: AppImage }
          - { os: macos-latest,   target: aarch64-apple-darwin,     archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   archive: zip }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: build
        run: cargo build --release --locked -p dc-app -p dc-cli
      - name: package
        shell: bash
        run: |
          name="designcomputer-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          ext=""; [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "target/release/designcomputer-app$ext" "target/release/designcomputer$ext" "$name/"
          cp README.md LICENSE "$name/"
          if [ "${{ matrix.archive }}" = "AppImage" ]; then
            curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
            chmod +x appimagetool
            APPIMAGETOOL="$PWD/appimagetool" packaging/linux/build-appimage.sh "${{ github.ref_name }}" "$name.AppImage"
          elif [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi
          echo "ASSET=$name.${{ matrix.archive }}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  publish:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # Everything before 1.0 is marked as a pre-release (alpha).
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
