name: ci

# Manual only: run it from the Actions tab ("Run workflow") when you want the full check.
# Releases have their own workflow (release.yml), which runs on a version tag.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The determinism contract (AGENTS.md §4.5) is only real if the same tests pass bit-for-bit on
  # every supported OS/CPU. The golden-hash tests in dc-math and dc-doc run on all of these.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest        # linux x86_64
          - macos-latest         # macOS arm64
          - windows-latest       # windows x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: clippy (includes the determinism lints in clippy.toml)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked
